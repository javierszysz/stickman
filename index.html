<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#87ceeb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Stickman Duet</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #87ceeb;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game { position: fixed; inset: 0; display: block; }

    .screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px;
      padding: 16px;
      box-sizing: border-box;
      background: linear-gradient(#87ceeb, #b8e0ff);
      z-index: 10;
      overflow-y: auto;
    }
    .screen.hidden { display: none; }

    .big-btn {
      font-size: 48px; font-weight: 800;
      padding: 28px 56px;
      border-radius: 24px;
      border: 6px solid #222;
      background: #ffd54a;
      color: #222;
      box-shadow: 0 8px 0 #222;
      cursor: pointer;
      touch-action: manipulation;
    }
    .big-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #222; }

    .color-row {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
      max-width: 720px;
    }
    .outfit-row {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
      max-width: 600px;
    }
    .color-btn {
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 14px;
      border: 4px solid #222;
      background: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #222;
      padding: 0;
      min-width: 0;
    }
    .color-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #222; }
    .color-btn.selected { outline: 3px solid #ffd54a; outline-offset: 3px; }
    .color-btn.pink { background: #ffc0e0; }
    .color-btn.blue { background: #a8d8ff; }
    .color-btn.green { background: #b8f0b8; }
    .color-btn.yellow { background: #ffe88a; }
    .color-btn.purple { background: #dcb0ff; }
    .color-btn.orange { background: #ffc89a; }
    .color-btn.teal { background: #a8efe0; }
    .color-btn.red { background: #ffb0b0; }
    .color-btn canvas { width: 100%; height: 100%; }
    .picker-label { font-size: 16px; color: #222; opacity: 0.85; margin-top: 4px; }
    .close-btn {
      position: absolute; top: 12px; right: 12px;
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 3px solid #222;
      background: #ffd54a;
      font-size: 22px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 0 #222;
      z-index: 11;
    }
    .close-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #222; }

    .title {
      font-size: 56px; font-weight: 900; color: #222;
      text-shadow: 4px 4px 0 #fff;
      margin: 0;
    }
    .sub { font-size: 22px; color: #222; opacity: 0.85; }

    .loader-stick { width: 160px; height: 200px; }


    .gear, .mute {
      position: fixed; top: 12px; z-index: 5;
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 4px solid #222;
      background: #fff;
      font-size: 28px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      opacity: 0.75;
      user-select: none;
    }
    .gear { right: 12px; }
    .mute { right: 80px; }
    .gear.hidden, .mute.hidden { display: none; }

    .flower-counter {
      position: fixed; top: 12px; left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      background: rgba(255, 255, 255, 0.85);
      border: 3px solid #2a1b14;
      border-radius: 999px;
      padding: 6px 18px;
      font-size: 22px; font-weight: 800; color: #222;
      box-shadow: 0 3px 0 #2a1b14;
      display: flex; align-items: center; gap: 8px;
      transition: transform 0.18s ease-out;
    }
    .flower-counter.hidden { display: none; }
    .flower-counter.bump { transform: translateX(-50%) scale(1.25); }

    .status {
      position: fixed; top: 12px; left: 12px; z-index: 5;
      font-size: 14px; color: #222; opacity: 0.7;
      background: rgba(255,255,255,0.6);
      padding: 4px 8px; border-radius: 8px;
    }
    .status.hidden { display: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="screen-landing" class="screen">
    <h1 class="title">Stickman Duet</h1>
    <div class="sub">A game for Lara</div>
    <button class="big-btn" id="btn-play">Play!</button>
  </div>

  <div id="screen-color" class="screen hidden">
    <button id="picker-close" class="close-btn hidden" title="Close">&#10005;</button>
    <div class="picker-label">Color</div>
    <div class="color-row" id="color-row"></div>
    <div class="picker-label">Outfit</div>
    <div class="outfit-row" id="outfit-row"></div>
  </div>

  <div id="screen-waiting" class="screen hidden">
    <canvas class="loader-stick" id="loader-canvas" width="160" height="200"></canvas>
    <div class="sub">Looking for a friend...</div>
  </div>

  <div id="gear" class="gear hidden" title="Color & outfit">&#9881;</div>
  <div id="mute" class="mute hidden" title="Mute / unmute">&#128266;</div>
  <div id="flower-counter" class="flower-counter hidden">&#127804; <span id="flower-count">0</span></div>
  <div id="status" class="status hidden"></div>

  <script src="./vendor/peerjs.min.js" integrity="sha384-nlUQ8ZqCbvStErob+biJNzSgltf6urV3VGqhfIfzhmg9RXmpeRm76ELw0pYnKlTR" crossorigin="anonymous"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
